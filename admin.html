<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AirTrackPro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <i class="fas fa-plane-departure"></i>
                <span>AirTrack<span class="highlight">Pro</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="tracking.html">Live Tracking</a></li>
                <li><a href="admin.html" class="active">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="admin-section">
        <div class="container">
            <h1><i class="fas fa-user-shield"></i> Admin Dashboard</h1>
            
            <div class="admin-stats">
                <div class="stat-card">
                    <i class="fas fa-suitcase"></i>
                    <div>
                        <h3>Active Luggage</h3>
                        <p class="stat-number" id="activeCount">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <h3>Delivered Today</h3>
                        <p class="stat-number" id="deliveredCount">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>
                        <h3>Alerts Today</h3>
                        <p class="stat-number" id="alertCount">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <div>
                        <h3>Active Users</h3>
                        <p class="stat-number" id="userCount">0</p>
                    </div>
                </div>
            </div>

            <div class="admin-controls">
                <button onclick="showAddLuggage()" class="btn-primary"><i class="fas fa-plus"></i> Add Luggage</button>
                <button onclick="exportData()" class="btn-secondary"><i class="fas fa-download"></i> Export Data</button>
                <button onclick="refreshData()" class="btn-secondary"><i class="fas fa-sync"></i> Refresh</button>
            </div>

            <div class="luggage-table">
                <h3>All Luggage Tracking</h3>
                <table id="luggageTable">
                    <thead>
                        <tr>
                            <th>Luggage ID</th>
                            <th>Owner</th>
                            <th>Status</th>
                            <th>Last Location</th>
                            <th>Last Update</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="luggageTableBody">
                        <tr><td colspan="6">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- Add Luggage Modal -->
    <div id="addModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Luggage</h3>
                <button onclick="closeModal()">&times;</button>
            </div>
            <form id="addLuggageForm">
                <input type="text" placeholder="Luggage ID" required>
                <input type="text" placeholder="Owner Name" required>
                <input type="tel" placeholder="Owner Phone" required>
                <input type="text" placeholder="Destination Airport" required>
                <input type="number" step="0.1" placeholder="Weight (kg)" required>
                <button type="submit" class="btn-primary">Add Luggage</button>
            </form>
        </div>
    </div>

    <script>
        async function loadAdminData() {
            const response = await fetch('https://your-cloud-function.com/admin/stats');
            const data = await response.json();
            
            document.getElementById('activeCount').textContent = data.active_luggage;
            document.getElementById('deliveredCount').textContent = data.delivered_today;
            document.getElementById('alertCount').textContent = data.alerts_today;
            document.getElementById('userCount').textContent = data.active_users;
            
            // Load table
            const tableBody = document.getElementById('luggageTableBody');
            tableBody.innerHTML = data.luggage.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.owner}</td>
                    <td><span class="status-badge ${item.status}">${item.status}</span></td>
                    <td>${item.latitude}, ${item.longitude}</td>
                    <td>${new Date(item.last_update).toLocaleString()}</td>
                    <td>
                        <button onclick="viewDetails('${item.id}')"><i class="fas fa-eye"></i></button>
                        <button onclick="sendAlert('${item.id}')"><i class="fas fa-bell"></i></button>
                     </td>
                </tr>
            `).join('');
        }
        
        function showAddLuggage() {
            document.getElementById('addModal').style.display = 'flex';
        }
        
        function closeModal() {
            document.getElementById('addModal').style.display = 'none';
        }
        
        function exportData() {
            window.location.href = 'https://your-cloud-function.com/export/csv';
        }
        
        function refreshData() {
            loadAdminData();
            showNotification('Data refreshed', 'success');
        }
        
        function viewDetails(id) {
            window.location.href = `tracking.html?luggage=${id}`;
        }
        
        async function sendAlert(id) {
            const message = prompt('Enter alert message:');
            if (message) {
                await fetch('https://your-cloud-function.com/admin/send-alert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ luggage_id: id, message: message })
                });
                showNotification('Alert sent', 'success');
            }
        }
        
        loadAdminData();
    </script>
</body>
</html>
